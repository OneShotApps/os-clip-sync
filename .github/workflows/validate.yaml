name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate Google OAuth client configuration
        run: node tools/with-google-oauth.js --check
      - name: Install API dependencies
        working-directory: apps/public/clip-sync-api-hono
        run: bun install --frozen-lockfile
      - name: Validate API
        working-directory: apps/public/clip-sync-api-hono
        run: |
          bun run format
          bun run lint
          bun run openapi:lint
          bun run test
      - name: Validate Compose definitions
        run: |
          docker compose -f compose.local.yaml config --quiet
          docker compose --env-file .env.example -f compose.dev.yaml config --quiet
          docker compose --env-file .env.example -f compose.prod.yaml config --quiet
      - name: Start local integration stack
        run: docker compose -f compose.local.yaml up -d --wait
      - name: Validate datastore integration
        working-directory: apps/public/clip-sync-api-hono
        run: bun run test:integration
      - name: Stop local integration stack
        if: always()
        run: docker compose -f compose.local.yaml down
      - name: Build production API container
        run: docker compose --env-file .env.example -f compose.dev.yaml build api

  flutter-shared-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      # Cargokit selects Rust's stable channel when Android rebuilds the
      # clipboard plugin instead of using its 4 KB-aligned precompiled binary.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Validate shared package
        working-directory: packages/private/clip-sync-client-core-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Validate and build Android
        working-directory: apps/public/clip-sync-android-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          node ../../../tools/with-google-oauth.js -- flutter build apk --debug --dart-define=CLIP_SYNC_API_URL=https://api.example.test
          ./tool/check-16kb-alignment.sh build/app/outputs/flutter-apk/app-debug.apk

  flutter-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Validate and build iOS
        working-directory: apps/public/clip-sync-ios-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          GEM_HOME="$(brew --prefix cocoapods)/libexec" ruby tool/configure-share-extension.rb
          node ../../../tools/with-google-oauth.js -- flutter build ios --release --no-codesign --dart-define=CLIP_SYNC_API_URL=https://api.example.test
          APP_PLIST=build/ios/iphoneos/Runner.app/Info.plist
          EXTENSION_PLIST=build/ios/iphoneos/Runner.app/PlugIns/ShareExtension.appex/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw "$APP_PLIST")" = "$(plutil -extract CFBundleShortVersionString raw "$EXTENSION_PLIST")"
          test "$(plutil -extract CFBundleVersion raw "$APP_PLIST")" = "$(plutil -extract CFBundleVersion raw "$EXTENSION_PLIST")"
      - name: Validate and build macOS
        working-directory: apps/public/clip-sync-macos-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          node ../../../tools/with-google-oauth.js -- flutter build macos --release --dart-define=CLIP_SYNC_API_URL=https://api.example.test

  flutter-windows:
    # The UWP share target requires the Visual Studio 2022 UWP toolchain.
    # windows-latest currently resolves to Visual Studio 2026, which no longer
    # supplies the Windows Runtime contract references to classic UWP projects.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Validate and build Windows
        working-directory: apps/public/clip-sync-windows-flutter
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze
          flutter test
          node ../../../tools/with-google-oauth.js -- flutter build windows --release --dart-define=CLIP_SYNC_API_URL=https://api.example.test
          msbuild windows\packaging\Package.wapproj /restore /p:Configuration=Release /p:Platform=x64
