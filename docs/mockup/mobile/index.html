<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip Sync mobile interaction reference</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.4 system-ui, sans-serif; background: #07101e; color: #eef7f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0b1220; }
      header { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 12px; background: #0b1220ee; backdrop-filter: blur(12px); }
      .header-actions { display: flex; gap: 8px; }
      h1 { font-size: 23px; margin: 0; }
      button { min-height: 44px; border: 1px solid #34465d; border-radius: 12px; background: #172439; color: inherit; padding: 10px 14px; }
      main { padding: 8px 16px 36px; }
      .hint { color: #96a9bd; margin: 0 2px 18px; font-size: 14px; }
      article { position: relative; padding: 17px 17px 17px 70px; margin-bottom: 12px; border: 1px solid #263750; border-radius: 15px; background: #121e30; }
      article.selected { border-color: #00bfa6; background: #10302d; }
      .select { position: absolute; left: 14px; top: 14px; width: 44px; padding: 0; border-radius: 50%; font-size: 20px; }
      article.selected .select { background: #00bfa6; color: #04110f; }
      .meta { display: flex; justify-content: space-between; color: #7edbce; font-size: 12px; font-weight: 700; }
      article p { overflow-wrap: anywhere; }
      .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
      .copy { border-color: #00bfa6; background: #00bfa6; color: #04110f; font-weight: 700; }
      #refreshing { display: none; text-align: center; color: #7edbce; padding: 10px; }
      @media (min-width: 520px) { body { max-width: 430px; margin: 0 auto; border-inline: 1px solid #263750; } }
    </style>
  </head>
  <body>
    <header><h1 id="title">Clip Sync</h1><div class="header-actions"><button id="delete-selected" hidden>Delete</button><button id="clear-selection" hidden>Cancel</button><button id="refresh">Refresh</button></div></header>
    <main>
      <p class="hint">Android · private history · items arrive only when you refresh</p>
      <div id="refreshing">History is up to date.</div>
      <article><button class="select" aria-label="Select item" aria-pressed="false">T</button><div class="meta"><span>TEXT · MACOS</span><span>JUST NOW</span></div><p>Quarterly planning notes are ready for review.</p><div class="actions"><button class="copy">Copy to Android</button><button aria-label="Delete">Delete</button></div></article>
      <article><button class="select" aria-label="Select item" aria-pressed="false">P</button><div class="meta"><span>PHOTO · ANDROID</span><span>3 MIN AGO</span></div><p>Photo · image/jpeg · 1.8 MB</p><div class="actions"><button class="copy">Copy to Android</button><button aria-label="Delete">Delete</button></div></article>
      <article><button class="select" aria-label="Select item" aria-pressed="false">T</button><div class="meta"><span>TEXT · WINDOWS</span><span>YESTERDAY</span></div><p>https://example.com/release-notes</p><div class="actions"><button class="copy">Copy to Android</button><button aria-label="Delete">Delete</button></div></article>
    </main>
    <script>
      document.querySelector('#refresh').addEventListener('click', () => {
        const notice = document.querySelector('#refreshing');
        notice.style.display = 'block';
        setTimeout(() => { notice.style.display = 'none'; }, 1400);
      });
      const title = document.querySelector('#title');
      const deleteSelected = document.querySelector('#delete-selected');
      const clearSelection = document.querySelector('#clear-selection');
      const refresh = document.querySelector('#refresh');
      const updateSelection = () => {
        const count = document.querySelectorAll('article.selected').length;
        title.textContent = count ? `${count} selected` : 'Clip Sync';
        deleteSelected.hidden = count === 0;
        clearSelection.hidden = count === 0;
        refresh.hidden = count > 0;
      };
      document.querySelectorAll('.select').forEach((button) => button.addEventListener('click', () => {
        const selected = button.closest('article').classList.toggle('selected');
        button.textContent = selected ? '✓' : button.closest('article').querySelector('.meta span').textContent.startsWith('PHOTO') ? 'P' : 'T';
        button.setAttribute('aria-pressed', String(selected));
        button.setAttribute('aria-label', selected ? 'Deselect item' : 'Select item');
        updateSelection();
      }));
      clearSelection.addEventListener('click', () => {
        document.querySelectorAll('article.selected .select').forEach((button) => button.click());
      });
      deleteSelected.addEventListener('click', () => {
        const selected = [...document.querySelectorAll('article.selected')];
        if (confirm(`Delete ${selected.length} selected ${selected.length === 1 ? 'item' : 'items'}?`)) {
          selected.forEach((item) => item.remove());
          updateSelection();
        }
      });
    </script>
  </body>
</html>
